<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAYHtech — Software, AI & Mobile App Development</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="description" content="AAYHtech is a software studio building mobile apps, web software, and AI-powered features for businesses.">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#0a0e14;--bg2:#0d1420;--card:#111a26;--border:#1e2a3a;--teal:#14b8a6;--teal2:#2dd4bf;--text:#e7eef6;--muted:#93a1b3;}
    html{scroll-behavior:smooth;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
    a{color:inherit;text-decoration:none;}
    section{scroll-margin-top:84px;}
    nav{position:sticky;top:0;z-index:50;background:rgba(10,14,20,0.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
    .nav-in{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
    .nav-in .brand img{height:44px;display:block;}
    .nav-links{display:flex;gap:30px;align-items:center;}
    .nav-links a{color:var(--muted);font-size:15px;font-weight:600;transition:color .15s;}
    .nav-links a:hover{color:var(--teal2);}
    .nav-cta{background:var(--teal);color:#04201c!important;font-weight:700;font-size:15px;padding:10px 20px;border-radius:10px;transition:transform .15s,background .15s;}
    .nav-cta:hover{background:var(--teal2);transform:translateY(-1px);}
    @media(max-width:760px){.nav-links a:not(.nav-cta){display:none;}}
    .hero{position:relative;text-align:center;padding:90px 0 40px;overflow:hidden;}
